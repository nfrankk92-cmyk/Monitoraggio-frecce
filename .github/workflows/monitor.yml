name: Monitor Treni Brescia-Milano

on:
  schedule:
    # Ogni 5 minuti, ma SOLO tra le 05:00 e le 21:59 UTC.
    # In ora italiana:
    #   - Estate (CEST, UTC+2): 07:00 - 23:59
    #   - Inverno (CET, UTC+1): 06:00 - 22:59
    # Nelle ore notturne il cron NON triggera affatto: 0 minuti consumati.
    # workflow_dispatch resta sempre disponibile per esecuzioni manuali fuori finestra.
    - cron: '*/5 5-21 * * *'
  workflow_dispatch:  # esecuzione manuale dal tab Actions (sempre disponibile)

# Evita esecuzioni sovrapposte: la successiva viene messa in coda finche' la precedente finisce
concurrency:
  group: monitor-treni
  cancel-in-progress: false

# Necessario per committare gli aggiornamenti di state.json
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit state changes (if any)
        run: |
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "Nessun cambio di stato, nulla da committare."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry: push puo' fallire se un altro run ha pushato nel frattempo
          for attempt in 1 2 3 4 5; do
            git add state.json
            if git diff --staged --quiet; then
              echo "Nulla da committare dopo rebase (stato gia' aggiornato dall'altro run)."
              exit 0
            fi
            git commit -m "chore: update state [skip ci]"
            if git push; then
              echo "Push riuscito al tentativo $attempt."
              exit 0
            fi
            echo "Push rifiutato (tentativo $attempt). Provo pull --rebase..."
            git reset --soft HEAD~1  # disfa il commit per ripreparare lo stato dopo il rebase
            git stash push -m "state-update-$attempt" -- state.json
            if ! git pull --rebase origin main; then
              echo "Rebase fallito, abort."
              git rebase --abort || true
              exit 1
            fi
            git stash pop || true
            sleep $((attempt * 2))
          done
          echo "Push fallito dopo 5 tentativi."
          exit 1
