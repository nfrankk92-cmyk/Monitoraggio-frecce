name: Monitor Treni Brescia-Milano

on:
  schedule:
    # Ogni 5 minuti. Cron GitHub Actions: minimo 5 min, possibili ritardi 5-15 min in alta domanda.
    - cron: '*/5 * * * *'
  workflow_dispatch:  # esecuzione manuale dal tab Actions

# Evita esecuzioni sovrapposte: la successiva viene messa in coda finche' la precedente finisce
concurrency:
  group: monitor-treni
  cancel-in-progress: false

# Necessario per committare gli aggiornamenti di state.json
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_TOKEN:   ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Commit state changes (if any)
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update state [skip ci]"
            git push
          else
            echo "Nessun cambio di stato, nulla da committare."
          fi
